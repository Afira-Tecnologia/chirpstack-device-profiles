name = "DTL-100"
description = "O DTL-100 é um sensor LoRaWAN de temperatura e umidade para ambientes internos, podendo ser possível conectar sensores externos via entrada USB-C. Os sensores internos de temperatura e umidade mede de -40 a 60 °C (depende da pilha conectada), e umidade de 0 a 99% com tolerância de 3% RH (umidade relativa)."

